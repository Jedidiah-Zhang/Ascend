name: Engine CI

on:
  push:
    paths: &paths
      - "kheker/engine/**"
      - "testbench/engine/**"
      - ".github/workflows/engine.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      # macOS 暂未纳入：当前未做兼容，先保证 Linux 与 Windows 通过。
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: 准备逗号小数区域（Linux）
        if: runner.os == 'Linux'
        run: |
          if ! command -v locale-gen >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y locales
          fi
          sudo locale-gen de_DE.UTF-8
          locale -a | grep -i de_DE
      - name: 配置无界面核心
        run: cmake -S kheker/engine -B build/engine -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: 编译核心、示例与测试
        run: cmake --build build/engine --config Release --parallel 4
      - name: 运行接口与执行测试
        run: ctest --test-dir build/engine --build-config Release --output-on-failure
