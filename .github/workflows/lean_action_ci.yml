name: Lean Action CI

on:
  push:
    paths:
      - "research/lean/**"
      - "research/equations/**"
      - "research/acceptance/**"
      - "backend/ascend/causal/**"
      - "backend/ascend/save/**"
      - "backend/ascend/weather/derive.py"
      - "backend/ascend/weather/mechanisms.py"
      - "backend/ascend/weather/weather_engine.py"
      - "backend/ascend/weather/field.py"
      - "backend/ascend/weather/features.py"
      - "backend/ascend/space/climate.py"
      - "backend/ascend/space/mechanisms.py"
      - "backend/ascend/game.py"
      - "backend/ascend/config.py"
      - "backend/tests/**"
      - "data/world.json"
  pull_request:
    paths:
      - "research/lean/**"
      - "research/equations/**"
      - "research/acceptance/**"
      - "backend/ascend/causal/**"
      - "backend/ascend/save/**"
      - "backend/ascend/weather/derive.py"
      - "backend/ascend/weather/mechanisms.py"
      - "backend/ascend/weather/weather_engine.py"
      - "backend/ascend/weather/field.py"
      - "backend/ascend/weather/features.py"
      - "backend/ascend/space/climate.py"
      - "backend/ascend/space/mechanisms.py"
      - "backend/ascend/game.py"
      - "backend/ascend/config.py"
      - "backend/tests/**"
      - "data/world.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: 生产注册表快照漂移巡检
        run: python3 research/equations/export_registry.py --check
      # 声明数据漂移巡检（issue #44 防漂移①）：来源改动未重新生成 GenDeclarationData.lean 时
      # lake build 不会变红，必须独立门禁。gen_lean.py 仅用 stdlib + ascend.config（stdlib-only）。
      - name: 声明数据漂移巡检（gen_lean.py --check）
        run: python3 research/equations/gen_lean.py --check
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean

  # 世界验收门禁（issue #46 P5）：C0–C2 / W0–W5 / I0–I1 任一判据失败即红。
  # 只依赖 Python 标准库 + 后端源码（不编译 C 扩展的路径也不引入 Lean）。
  acceptance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: 安装后端依赖
        run: python -m pip install -q -r requirements.txt
      - name: Lean 实例漂移巡检（生产声明 → UnrolledDag）
        run: python research/acceptance/run_acceptance.py --check
      - name: 世界验收 runner（C0–C2 / W0–W5 / I0–I1）
        run: python research/acceptance/run_acceptance.py --json acceptance.json
      - name: 上传验收产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: acceptance.json
          if-no-files-found: ignore
