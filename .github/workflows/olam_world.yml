name: Olam World CI

on:
  push:
    paths: &paths
      - "olam/**"
      - "testbench/olam/**"
      - "kheker/engine/**"
      - ".github/workflows/olam_world.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      # C ABI 插件需要覆盖三大桌面平台；世界库测试在 macOS 上也纳入矩阵。
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: 配置世界库
        run: cmake -S olam -B build/olam -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: 编译世界库与测试
        run: cmake --build build/olam --config Release --parallel 4
      - name: 运行世界库测试
        run: ctest --test-dir build/olam --build-config Release --output-on-failure
      - name: C ABI 插件冒烟测试
        run: ctest --test-dir build/olam --build-config Release -R plugin --no-tests=error --output-on-failure
