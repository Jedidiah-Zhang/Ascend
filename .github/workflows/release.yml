name: Release

# 触发：
#   - 推送 v* 标签（正式发布：构建 + 自动发版）
#   - 手动运行（仅构建，产物作为 artifact 供下载，不发版）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # 发布 job 需要创建 Release

jobs:
  check-version:
    name: 版本对账
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')   # 仅 tag 触发时校验
    steps:
      - uses: actions/checkout@v5.1.0

      - name: 校验触发 tag 与 version.txt 一致
        run: bash build/ci/check_version.sh --tag "${{ github.ref_name }}"

  build-linux:
    name: 构建 Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"

      - name: 安装构建依赖
        run: |
          python -m pip install -q -r build/nuitka/requirements-build.txt
          python -m pip install -q -r requirements.txt

      - name: 一键打包后端（研究平台发行）
        run: bash build/build_backend_release.sh linux

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-linux
          path: |
            build/dist/release/ascend-server-linux.tar.gz
          if-no-files-found: error

  build-windows:
    name: 构建 Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"   # Nuitka --mingw64 不支持 3.13+

      - name: 安装构建依赖
        shell: bash
        run: |
          python -m pip install -q -r build/nuitka/requirements-build.txt
          python -m pip install -q -r requirements.txt

      - name: 缓存 mingw-w64
        uses: actions/cache@v5.1.0
        with:
          path: ~/mingw64
          key: mingw-16.1.0-msvcrt

      - name: 安装 mingw-w64
        shell: bash
        run: bash build/ci/setup_mingw.sh

      - name: 一键打包后端（原生编译，研究平台发行）
        shell: bash
        env:
          BACKEND_WIN_SCRIPT: build/nuitka/build_backend_windows_native.sh
        run: bash build/build_backend_release.sh windows

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-windows
          path: |
            build/dist/release/ascend-server-windows.zip
          if-no-files-found: error

  test:
    name: 全量测试（发布前关卡）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"

      - name: 安装测试依赖
        run: python -m pip install -q -r requirements.txt

      - name: 后端单元测试（并行）
        run: |
          cd backend && PYTHONPATH=. python -m pytest tests/unit -n 4 -q

      - name: 后端集成测试（串行，真实 server 子进程）
        run: |
          cd backend && PYTHONPATH=. python -m pytest tests/integration -q

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')   # 仅 tag 触发时发版
    needs: [check-version, build-linux, build-windows, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0   # 完整历史，publish_release.sh 需校验 tag

      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-linux
          path: build/dist/release

      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-windows
          path: build/dist/release

      - name: 发布（版本化命名 + 上传 Release）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash build/ci/publish_release.sh
