name: 优化/重构
description: 调整模块结构或实现；行为变更按新设计明确记录
title: 'refactor: '
labels: [refactor]
body:
  - type: textarea
    id: current
    attributes:
      label: 现状与问题
      description: 当前实现有什么问题？（耦合、重复、性能、可读性、可测试性等）
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: 重构目标
      description: 期望达到的结构或设计（可引用设计模式、参考模块）
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      description: 主涉及模块
      options:
        - 世界库
        - 智能体库
        - 游戏平台（Godot）
        - 研究平台（C++/Qt）
        - 跨模块
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: 实施计划
      description: 拆解步骤，便于分步提交
      value: |
        - [ ] 对齐已确认的新设计与接口
        - [ ] 明确行为变更及受影响模块
        - [ ] 编写/调整测试覆盖已确认行为
        - [ ] 精简实现并清理冗余
        - [ ] 相关测试全部通过
  - type: textarea
    id: behavior
    attributes:
      label: 行为变更说明
      description: 重构后对外行为/协议/存档格式是否有变化？如有需注明迁移方案
  - type: textarea
    id: references
    attributes:
      label: 关联
      description: 关联的 Issue 编号或设计文档
